name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install check tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Type check
        run: python -m mypy src tests
      - name: Test
        run: python -m unittest discover -s tests -t . -v
      - name: Run synthetic demo
        run: python -m media_qc_agent.cli.demo
      - name: Replay offline evaluation fixtures
        run: python -m media_qc_agent.cli.evaluate --mask-version-labels
      - name: Compare policy versions on recorded outputs
        run: python -m media_qc_agent.cli.compare --expect evals/results/policy-comparison-v1.json > /dev/null
      - name: Compare workflow arms with the rules-only baseline
        run: python -m media_qc_agent.cli.baseline --expect evals/results/baseline-comparison-v1.json > /dev/null
